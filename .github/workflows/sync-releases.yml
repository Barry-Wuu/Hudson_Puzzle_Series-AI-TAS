name: SyncReleasesFromGitCode
on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"
permissions:
  contents: write
jobs:
  sync-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 从 GitCode 同步 Release 与资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/assets.tsv
          import json, os, urllib.request, urllib.parse
          API = 'https://api.gitcode.com/api/v5/repos/Barry_Wu_/Hudson_Puzzle_Series-AI-TAS/releases'
          H = {'User-Agent':'Mozilla/5.0', 'Authorization':'Bearer '+os.environ['GITCODE_TOKEN']}
          rels = json.load(urllib.request.urlopen(urllib.request.Request(API, headers=H), timeout=60))
          for rel in rels:
              for a in rel.get('assets', []):
                  u = urllib.parse.quote(a['browser_download_url'], safe=':/%?=&')
                  print('%s\t%s\t%s' % (rel['tag_name'], a['name'], u))
          PY
          cat /tmp/assets.tsv

          # 创建 Release（已存在则跳过）
          TAG="解谜系列"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "解谜系列" --notes "《Hudson解谜系列》游戏原文件" --target main
          fi

          # 逐个下载并上传；curl 与已跑通的 GooBall 工作流同款，不跟 urllib 抢
          mkdir -p release_assets
          while IFS=$'\t' read -r tag name url; do
            dest="release_assets/${name}"
            echo "### $name"
            ok=0
            for attempt in 1 2 3; do
              curl -fL --retry 2 --retry-delay 5 --connect-timeout 30 \
                -H "PRIVATE-TOKEN: ${GITCODE_TOKEN}" -H "User-Agent: Mozilla/5.0" \
                -o "$dest" "$url" && test -s "$dest" && { ok=1; break; }
              sleep 10
            done
            if [ "$ok" = 0 ]; then echo "DOWNLOAD FAILED: $name"; continue; fi
            echo "size $(stat -c%s "$dest")"
            gh release upload "$TAG" "$dest" --repo "$GITHUB_REPOSITORY" --clobber
            rm -f "$dest"
          done < /tmp/assets.tsv

          gh release list --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
